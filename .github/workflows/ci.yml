name: CI

on:
  push:
    branches:
      - main
      - 'fix/*'
      - 'feature/*'
  pull_request:
    branches:
      - main

jobs:
  # The shipped product is the VS Code extension, so this is the job that has
  # to mean something. It installs from the committed lockfile, audits, runs
  # the suite, and fails when a test fails.
  extension:
    name: extension
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: hybridmind-extension

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'
          cache-dependency-path: hybridmind-extension/package-lock.json

      - name: Install dependencies
        run: npm ci --prefer-offline

      - name: Security audit (fail on high/critical)
        run: npm audit --audit-level=high

      # Compiles the extension and the tests, then runs mocha. No
      # continue-on-error: a failing test fails the build.
      - name: Compile and test
        run: npm test

  # Checks that apply to the whole repository rather than one package.
  repository:
    name: repository
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --prefer-offline

      - name: Security audit (fail on high/critical)
        run: npm audit --audit-level=high

      # Shell execution must go through execFile with shell:false, never exec.
      # This used to scan hybridmind-backend/routes, which was archived, so it
      # passed without scanning anything. It now scans code that ships, and
      # fails if a directory it expects is missing, so it cannot quietly go
      # vacuous again.
      #
      # A plain pattern cannot tell cp.exec() from RegExp's .exec(), and
      # excluding every .exec() lets cp.exec() through, which is the case that
      # matters. So the rule is scoped by what is dangerous: in any file that
      # imports child_process, every exec( or execSync( fails, whether called
      # as a member, destructured, or chained off require().
      - name: No exec() in shipped code (use execFile with shell:false)
        run: |
          set -u
          dirs="hybridmind-extension/src"
          [ -d packages ] && dirs="$dirs packages"
          for d in $dirs; do
            [ -d "$d" ] || { echo "ERROR: expected directory $d is missing"; exit 1; }
          done
          files=$(grep -rlE --include='*.ts' --include='*.js' --include='*.cjs' \
                    "child_process" $dirs || true)
          if [ -z "$files" ]; then
            echo "No file imports child_process in: $dirs"
            exit 0
          fi
          # Drop regex-literal receivers first (/pattern/flags.exec(...)), which
          # are RegExp, not a shell. A regex held in a variable is not
          # recognised; use a literal or String.match in such a file.
          hits=$(grep -nE '(^|[^[:alnum:]_])(exec|execSync)[[:space:]]*\(' $files \
                   | sed -E 's#/([^/\\]|\\.)+/[gimsuy]*\.exec\(##g' \
                   | grep -E '(^|[^[:alnum:]_])(exec|execSync)[[:space:]]*\(' || true)
          if [ -n "$hits" ]; then
            echo "$hits"
            echo "ERROR: exec()/execSync() in a file that imports child_process; use execFile() with shell:false"
            exit 1
          fi
          echo "child_process is used only through execFile in:"
          echo "$files"
