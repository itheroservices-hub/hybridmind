name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  # Manual runs release whatever version package.json holds on the chosen
  # branch, and create its v<version> tag. This lets a release start without
  # pushing a tag, which some environments that can merge cannot do.
  workflow_dispatch:

# Creating the release, and the tag on a manual run, needs write access.
permissions:
  contents: write

jobs:
  release:
    name: release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    env:
      NODE_ENV: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --prefer-offline

      - name: Security audit (fail on high/critical)
        run: npm audit --audit-level=high

      # Packaging used to end in `|| echo "...skipping"`, so a failure still
      # produced a release, just without the .vsix. It fails loudly now.
      - name: Build extension (VSIX)
        id: build
        working-directory: hybridmind-extension
        run: |
          set -euo pipefail
          version=$(node -p "require('./package.json').version")
          tag="v$version"
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            if [ "$tag" != "$GITHUB_REF_NAME" ]; then
              echo "ERROR: tag $GITHUB_REF_NAME does not match package.json version $version"
              exit 1
            fi
          elif git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null; then
            # A manual run must not overwrite a release that already exists.
            echo "ERROR: $tag already exists; bump the version in package.json first"
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          npm ci
          mkdir -p ../dist
          npx --yes @vscode/vsce@4.0.0 package --out "../dist/hybridmind-$version.vsix"

      # vsce does not bundle; it packages production dependencies from
      # node_modules. A .vscodeignore that excluded node_modules shipped a
      # .vsix whose extension.js failed on require('axios') before activating.
      # This makes that impossible to release again.
      - name: Verify the VSIX carries its runtime dependencies
        run: |
          set -euo pipefail
          vsix=$(ls dist/*.vsix)
          listing=$(unzip -l "$vsix")
          # Here-strings, not `echo | grep -q`: under pipefail, grep -q exits on
          # the first match, echo takes SIGPIPE, and a found match reads as failure.
          for dep in axios @supabase/supabase-js dotenv @hybridmind/ontology-core @hybridmind/local-runtimes; do
            grep -q "extension/node_modules/$dep/package.json" <<<"$listing" \
              || { echo "ERROR: $dep is missing from $vsix"; exit 1; }
          done
          grep -q "extension/out/extension.js" <<<"$listing" \
            || { echo "ERROR: out/extension.js is missing from $vsix"; exit 1; }
          echo "All runtime dependencies present in $vsix"

      # Publishes only when a VSCE_PAT secret exists: a Marketplace token with
      # the Marketplace (Manage) scope, from an account that owns the
      # publisher. Without one, the release still gets the .vsix attached for a
      # manual upload.
      #
      # The token is scoped to the step that needs it. A step's `if` cannot read
      # its own env, and job-level env would hand the token to every step,
      # including npm ci, which runs third-party install scripts. So one step
      # reports only whether the secret exists, and only the publish step sees it.
      - name: Check for a Marketplace token
        id: pat
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: echo "present=${VSCE_PAT:+yes}" >> "$GITHUB_OUTPUT"

      - name: Publish to the VS Code Marketplace
        if: steps.pat.outputs.present == 'yes'
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: npx --yes @vscode/vsce@4.0.0 publish --packagePath dist/*.vsix

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.build.outputs.tag }}
          target_commitish: ${{ github.sha }}
          files: dist/*.vsix
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Release summary
        run: echo "Release created for ${{ steps.build.outputs.tag }}"
